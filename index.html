<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#071019" />
  <title>Итоги 2026 — Backroom Office</title>
  <link rel="stylesheet" href="./styles.css" />
  <script src="https://cdn.babylonjs.com/babylon.js"></script>
</head>
<body>
  <canvas id="renderCanvas" aria-label="Виртуальное пространство Итоги 2026"></canvas>

  <div id="boot" class="overlay boot">
    <div class="boot-card">
      <div class="eyebrow">ЦК БОРУЛ · BACKROOM OFFICE</div>
      <h1>ИТОГИ 2026</h1>
      <div class="terminal" id="bootLog"></div>
      <button id="enterButton" class="primary" disabled>ВОЙТИ В HR HUB</button>
    </div>
  </div>

  <div id="hud" class="hud hidden">
    <div class="hud-top">
      <div>
        <div class="eyebrow">BACKROOM OFFICE · ИТОГИ 2026</div>
        <div class="hud-title" id="zoneName">HR HUB — ЦЕНТРАЛЬНЫЙ ЗАЛ</div>
      </div>
      <div class="progress-card">
        <span>ПРОЙДЕНО ЗОН</span>
        <strong id="progressText">0 / 3</strong>
      </div>
    </div>

    <div id="hubGuide" class="hub-guide">
      <div class="hub-guide-title">КАРТА ПИЛОТА</div>
      <div class="guide-row" data-zone="recruitment"><span>01</span><b>ПРИЁМ</b><i>○</i></div>
      <div class="guide-row" data-zone="ai"><span>02</span><b>AI LAB</b><i>○</i></div>
      <div class="guide-row" data-zone="mentoring"><span>03</span><b>НАСТАВНИЧЕСТВО</b><i>○</i></div>
      <div class="hub-guide-hint">Подойдите к светящейся двери и нажмите <b>E</b></div>
    </div>

    <div id="crosshair" class="crosshair">+</div>
    <div id="interactionPrompt" class="interaction hidden">E — взаимодействовать</div>
    <div class="controls">WASD — движение · мышь — обзор · E — действие · ESC — освободить курсор</div>
  </div>

  <div id="toast" class="toast hidden"></div>
  <div id="fade" class="fade"></div>

  <script src="./src/data.js"></script>
  <script src="./src/app.js"></script>
</body>
</html>
